<script src="app.js"></script><script>
const fN=n=>String(n).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);
let td=new Date().toDateString(),sO={};try{sO=JSON.parse(localStorage.getItem("ch_v2"))||{}}catch(e){}
let tot=(Number(sO.t)||268)+1,tdy=(sO.dt===td?(Number(sO.d)||125):110)+1;
localStorage.setItem("ch_v2",JSON.stringify({t:tot,d:tdy,dt:td}));
document.getElementById("v-today").textContent=fN(tdy);document.getElementById("v-total").textContent=fN(tot);
const dm=document.getElementById("dm-btn");if(localStorage.getItem("ch_dm")==="1"){document.body.classList.add("dark");dm.textContent="☀️"}
dm.onclick=()=>{let k=document.body.classList.toggle("dark");dm.textContent=k?"☀️":"🌙";localStorage.setItem("ch_dm",k?"1":"0")};
let dP;window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();dP=e});
document.getElementById("pwa-btn").onclick=async()=>{if(dP){dP.prompt();let r=await dP.userChoice;if(r.outcome==="accepted")alert("🎉 اپلیکیشن چرتکه با موفقیت نصب شد!");dP=null}else alert("📲 اپلیکیشن چرتکه روی گوشی شما نصب است (یا از منوی ۳ نقطه بالای مرورگر گزینه Add to Home screen را بزنید).")};
function uCk(){const d=new Date(),fa=new Intl.DateTimeFormat("fa-IR",{dateStyle:"medium"}).format(d),ar=new Intl.DateTimeFormat("fa-IR-u-ca-islamic",{day:"numeric",month:"short"}).format(d),en=d.toISOString().slice(0,10).replace(/-/g,"/"),tm=d.toLocaleTimeString("fa-IR");document.getElementById("t-bar").innerHTML=`<span>☀️ ${fa}</span>|<span>🌙 ${ar}</span>|<span>🌍 ${en}</span>|<span>⏰ ${tm}</span>`}setInterval(uCk,1000);uCk();
const T=[["vam","🏦","وام و اقساط","سود و قسط ماهانه"],["tala","🪙","فاکتور طلا","طلای نو و دست دوم"],["chek","✒️","چک صیادی","عدد به حروف ریال و تومان"],["kart","💳","شبا و حساب","تبدیل شبا، حساب و کارت"],["ghesti","📱","خرید اقساطی","کالا و موبایل قسطی"],["arz","📈","سود ارز و تتر","درصد سود و ضرر"],["sekeh","🟡","حباب سکه","ارزش ذاتی و حباب"],["sepordeh","💰","سود سپرده","سود روزشمار و ماهانه"],["tabdil","⚖️","تبدیل واحد طلا","مثقال، گرم، سوت و انس"],["darsad","％","درصد و تخفیف","تخفیف و درصد کنکور"],["amlak","🏠","رهن و اجاره","تبدیل رهن به اجاره"],["komision","🤝","کمیسیون املاک","حق بنگاه و مالیات"],["khodro","🚗","افت قیمت خودرو","رنگ‌شدگی و شاسی"],["sokht","⛽","مصرف سوخت","صدی چند و هزینه سفر"],["bimeh","🛡️","بیمه و بازنشستگی","سهم کارگر و مستمری"],["hoghoogh","👷","عیدی و سنوات","طبق قانون کار"],["mehrieh","💍","مهریه به نرخ روز","شاخص بانک مرکزی"],["ers","📜","سهم‌الارث","تقسیم ارث قانونی"],["tarikh","📅","تبدیل تاریخ","شمسی، میلادی و قمری"],["sen","🎂","محاسبه سن دقیق","سال، ماه و روز"],["faseleh","⏳","فاصله دو تاریخ","اختلاف دقیق"],["bmi","🏃","تناسب اندام BMI","وزن ایده‌آل"],["kaleri","🍎","کالری روزانه","تثبیت و لاغری"],["bardari","🤰","سن بارداری","هفته و زایمان"],["moadel","🎓","محاسبه معدل","دانشگاه و مدرسه"]];
const g=document.getElementById("grid"),s=document.getElementById("srch");function r(q=""){g.innerHTML=T.filter(x=>(x[2]+x[3]).includes(q)).map(x=>`<a href="${x[0]}.html" class="t-card"><div class="t-icon">${x[1]}</div><div><h3>${x[2]}</h3><p>${x[3]}</p></div></a>`).join("")}r();s.oninput=e=>r(e.target.value.trim());

</script></body></html>
