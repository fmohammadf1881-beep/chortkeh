name: Build APK
on:
  push:
    paths: ['.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Logo and APK
        run: |
          BT=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | sort -V | tail -n 1)
          PF=$(ls -d $ANDROID_SDK_ROOT/platforms/android-* | sort -V | tail -n 1)
          mkdir -p src/ir/chortkeh/app res/drawable obj
          cat << 'EOF' > MakeIcon.java
          import java.awt.*;
          import java.awt.image.BufferedImage;
          import java.io.File;
          import javax.imageio.ImageIO;
          public class MakeIcon {
            static void make(int s, String path) throws Exception {
              BufferedImage b = new BufferedImage(s, s, BufferedImage.TYPE_INT_ARGB);
              Graphics2D g = b.createGraphics();
              g.setRenderingHint(RenderingHints.KEY_ANTIALIASING, RenderingHints.VALUE_ANTIALIAS_ON);
              g.setPaint(new GradientPaint(0, 0, new Color(30, 58, 138), s, s, new Color(37, 99, 235)));
              g.fillRoundRect(0, 0, s, s, s/4, s/4);
              g.setColor(Color.WHITE);
              g.fillRoundRect((int)(s*0.18), (int)(s*0.14), (int)(s*0.64), (int)(s*0.72), s/8, s/8);
              g.setColor(new Color(16, 185, 129));
              g.fillRoundRect((int)(s*0.25), (int)(s*0.21), (int)(s*0.50), (int)(s*0.17), s/20, s/20);
              int w = (int)(s*0.22), h = (int)(s*0.16), r = s/22;
              int x1 = (int)(s*0.25), x2 = (int)(s*0.53), y1 = (int)(s*0.44), y2 = (int)(s*0.64);
              g.setColor(new Color(59, 130, 246));
              g.fillRoundRect(x1, y1, w, h, r, r);
              g.fillRoundRect(x2, y1, w, h, r, r);
              g.fillRoundRect(x1, y2, w, h, r, r);
              g.setColor(new Color(245, 158, 11));
              g.fillRoundRect(x2, y2, w, h, r, r);
              g.setColor(Color.WHITE);
              int t = Math.max(2, s/36);
              g.fillRect(x1 + w/4, y1 + h/2 - t/2, w/2, t);
              g.fillRect(x1 + w/2 - t/2, y1 + h/4, t, h/2);
              g.fillRect(x2 + w/4, y1 + h/2 - t/2, w/2, t);
              g.fillRect(x1 + w/4, y2 + h/2 - t/2, w/2, t);
              g.fillRect(x2 + w/4, y2 + h/3, w/2, t);
              g.fillRect(x2 + w/4, y2 + (h*2)/3 - t, w/2, t);
              g.dispose();
              ImageIO.write(b, "png", new File(path));
            }
            public static void main(String[] a) throws Exception {
              make(512, "logo.png");
              make(192, "res/drawable/icon.png");
            }
          }
          EOF
          javac MakeIcon.java && java MakeIcon
          rm -f MakeIcon.java MakeIcon.class
          echo '{"name":"چرتکه | ماشین حساب آنلاین","short_name":"چرتکه","start_url":"./index.html","display":"standalone","background_color":"#f8fafc","theme_color":"#1e40af","icons":[{"src":"logo.png","sizes":"512x512","type":"image/png"}]}' > manifest.json
          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android" package="ir.chortkeh.app" android:versionCode="2" android:versionName="1.1"><uses-sdk android:minSdkVersion="21" android:targetSdkVersion="33"/><uses-permission android:name="android.permission.INTERNET"/><application android:label="چرتکه" android:icon="@drawable/icon" android:usesCleartextTraffic="true" android:theme="@android:style/Theme.DeviceDefault.NoActionBar"><activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > AndroidManifest.xml
          echo 'package ir.chortkeh.app; import android.app.Activity; import android.content.Intent; import android.net.Uri; import android.os.Bundle; import android.webkit.*; public class MainActivity extends Activity { WebView w; @Override protected void onCreate(Bundle b) { super.onCreate(b); w = new WebView(this); WebSettings s = w.getSettings(); s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true); w.setWebViewClient(new WebViewClient() { @Override public boolean shouldOverrideUrlLoading(WebView v, String u) { if (u.contains("github.io")) return false; startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(u))); return true; } }); setContentView(w); w.loadUrl("https://fmohammadf1881-beep.github.io/chortkeh/"); } @Override public void onBackPressed() { if (w != null && w.canGoBack()) w.goBack(); else super.onBackPressed(); } }' > src/ir/chortkeh/app/MainActivity.java
          javac -source 8 -target 8 -cp "$PF/android.jar" -d obj src/ir/chortkeh/app/MainActivity.java
          $BT/d8 --lib "$PF/android.jar" --output . obj/ir/chortkeh/app/*.class
          $BT/aapt package -f -M AndroidManifest.xml -S res -I "$PF/android.jar" -F unaligned.apk
          $BT/aapt add unaligned.apk classes.dex
          $BT/zipalign -f 4 unaligned.apk aligned.apk
          keytool -genkeypair -v -keystore key.jks -alias ch -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Chortkeh,O=Chortkeh,C=IR"
          $BT/apksigner sign --ks key.jks --ks-pass pass:123456 --key-pass pass:123456 --out chortkeh.apk aligned.apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add chortkeh.apk logo.png manifest.json
          git commit -m "Add custom logo and update APK" || true
          git push
