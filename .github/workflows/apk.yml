name: Build APK
on:
  push:
    paths: ['.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Logo, Favicon, Intro and APK
        run: |
          BT=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | sort -V | tail -n 1)
          PF=$(ls -d $ANDROID_SDK_ROOT/platforms/android-* | sort -V | tail -n 1)
          mkdir -p src/ir/chortkeh/app res/drawable obj
          cat << 'EOF' > MakeIcon.java
          import java.awt.*;
          import java.awt.image.BufferedImage;
          import java.io.File;
          import javax.imageio.ImageIO;
          public class MakeIcon {
            static void m(int s, String p) throws Exception {
              BufferedImage b = new BufferedImage(s, s, BufferedImage.TYPE_INT_ARGB);
              Graphics2D g = b.createGraphics();
              g.setRenderingHint(RenderingHints.KEY_ANTIALIASING, RenderingHints.VALUE_ANTIALIAS_ON);
              g.setPaint(new GradientPaint(0, 0, new Color(15, 23, 42), s, s, new Color(37, 99, 235)));
              g.fillRoundRect(0, 0, s, s, s/4, s/4);
              g.setColor(new Color(245, 158, 11));
              g.setStroke(new BasicStroke(Math.max(2, s/28f)));
              g.drawRoundRect(s/12, s/12, s - s/6, s - s/6, s/5, s/5);
              g.setColor(Color.WHITE);
              g.fillRoundRect((int)(s*0.20), (int)(s*0.16), (int)(s*0.60), (int)(s*0.68), s/8, s/8);
              g.setColor(new Color(16, 185, 129));
              g.fillRoundRect((int)(s*0.26), (int)(s*0.22), (int)(s*0.48), (int)(s*0.16), s/20, s/20);
              int w = (int)(s*0.21), h = (int)(s*0.15), r = s/22, x1 = (int)(s*0.26), x2 = (int)(s*0.53), y1 = (int)(s*0.43), y2 = (int)(s*0.62);
              g.setColor(new Color(37, 99, 235));
              g.fillRoundRect(x1, y1, w, h, r, r); g.fillRoundRect(x2, y1, w, h, r, r); g.fillRoundRect(x1, y2, w, h, r, r);
              g.setColor(new Color(245, 158, 11)); g.fillRoundRect(x2, y2, w, h, r, r);
              g.setColor(Color.WHITE);
              int t = Math.max(2, s/36);
              g.fillRect(x1 + w/4, y1 + h/2 - t/2, w/2, t); g.fillRect(x1 + w/2 - t/2, y1 + h/4, t, h/2);
              g.fillRect(x2 + w/4, y1 + h/2 - t/2, w/2, t); g.fillRect(x1 + w/4, y2 + h/2 - t/2, w/2, t);
              g.fillRect(x2 + w/4, y2 + h/3, w/2, t); g.fillRect(x2 + w/4, y2 + (h*2)/3 - t, w/2, t);
              g.dispose(); ImageIO.write(b, "png", new File(p));
            }
            public static void main(String[] a) throws Exception { m(512, "logo.png"); m(192, "res/drawable/icon.png"); m(48, "favicon.ico"); }
          }
          EOF
          javac MakeIcon.java && java MakeIcon && rm -f MakeIcon.*
          python3 -c '
          import glob
          tag = "<link rel=\"icon\" type=\"image/png\" sizes=\"512x512\" href=\"logo.png\"><link rel=\"shortcut icon\" href=\"favicon.ico\"><link rel=\"apple-touch-icon\" href=\"logo.png\">"
          for f in glob.glob("*.html"):
            s = open(f, encoding="utf-8").read()
            if "rel=\"icon\"" not in s: s = s.replace("<head>", "<head>" + tag, 1)
            s = s.replace("🧮 چرتکه", "<img src=\"logo.png\" style=\"width:28px;height:28px;vertical-align:middle;border-radius:7px;margin-left:6px\">چرتکه")
            open(f, "w", encoding="utf-8").write(s)
          a = open("app.js", encoding="utf-8").read()
          intro = "if(!sessionStorage.getItem(\"ch_in\")){sessionStorage.setItem(\"ch_in\",\"1\");const sp=document.createElement(\"div\");sp.style.cssText=\"position:fixed;inset:0;background:linear-gradient(135deg,#0f172a,#1e40af);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:opacity .4s\";sp.innerHTML=`<img src=\"logo.png\" style=\"width:88px;height:88px;border-radius:22px;box-shadow:0 8px 25px rgba(0,0,0,.4);margin-bottom:14px\"><div style=\"font-size:1.4rem;font-weight:800\">چرتکه</div><div style=\"font-size:.82rem;color:#cbd5e1;margin-top:4px\">جعبه ابزار هوشمند محاسباتی</div>`;document.body.appendChild(sp);setTimeout(()=>{sp.style.opacity=\"0\";setTimeout(()=>sp.remove(),400)},850);}"
          if "ch_in" not in a:
            a = a.replace("document.addEventListener(\"DOMContentLoaded\",()=>{", "document.addEventListener(\"DOMContentLoaded\",()=>{" + intro, 1)
            a = a.replace("🧮 ${SITE_NAME}", "<img src=\"logo.png\" style=\"width:24px;height:24px;vertical-align:middle;border-radius:6px\"> ${SITE_NAME}")
            open("app.js", "w", encoding="utf-8").write(a)
          '
          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android" package="ir.chortkeh.app" android:versionCode="3" android:versionName="1.2"><uses-sdk android:minSdkVersion="21" android:targetSdkVersion="33"/><uses-permission android:name="android.permission.INTERNET"/><application android:label="چرتکه" android:icon="@drawable/icon" android:usesCleartextTraffic="true" android:theme="@android:style/Theme.DeviceDefault.NoActionBar"><activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > AndroidManifest.xml
          cat << 'EOF' > src/ir/chortkeh/app/MainActivity.java
          package ir.chortkeh.app;
          import android.app.Activity; import android.content.Intent; import android.graphics.*; import android.graphics.drawable.GradientDrawable;
          import android.net.Uri; import android.os.Bundle; import android.view.*; import android.webkit.*; import android.widget.*;
          public class MainActivity extends Activity {
            WebView w; LinearLayout sp;
            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              FrameLayout root = new FrameLayout(this);
              w = new WebView(this); WebSettings s = w.getSettings(); s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true);
              sp = new LinearLayout(this); sp.setOrientation(LinearLayout.VERTICAL); sp.setGravity(Gravity.CENTER);
              sp.setBackground(new GradientDrawable(GradientDrawable.Orientation.TL_BR, new int[]{0xFF0F172A, 0xFF1E40AF}));
              ImageView im = new ImageView(this); im.setImageResource(R.drawable.icon);
              LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(240, 240); lp.bottomMargin = 36; sp.addView(im, lp);
              TextView t1 = new TextView(this); t1.setText("چرتکه"); t1.setTextColor(Color.WHITE); t1.setTextSize(26); t1.setTypeface(null, Typeface.BOLD); t1.setGravity(Gravity.CENTER); sp.addView(t1);
              TextView t2 = new TextView(this); t2.setText("جعبه ابزار هوشمند محاسباتی"); t2.setTextColor(0xFFCBD5E1); t2.setTextSize(14); t2.setGravity(Gravity.CENTER);
              LinearLayout.LayoutParams lp2 = new LinearLayout.LayoutParams(-2, -2); lp2.topMargin = 10; lp2.bottomMargin = 50; sp.addView(t2, lp2);
              ProgressBar pb = new ProgressBar(this); sp.addView(pb, new LinearLayout.LayoutParams(90, 90));
              w.setWebViewClient(new WebViewClient() {
                @Override public void onPageFinished(WebView v, String u) { sp.animate().alpha(0f).setDuration(400).withEndAction(() -> sp.setVisibility(View.GONE)); }
                @Override public boolean shouldOverrideUrlLoading(WebView v, String u) { if (u.contains("github.io")) return false; startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(u))); return true; }
              });
              root.addView(w); root.addView(sp); setContentView(root);
              w.loadUrl("https://fmohammadf1881-beep.github.io/chortkeh/");
            }
            @Override public void onBackPressed() { if (w != null && w.canGoBack()) w.goBack(); else super.onBackPressed(); }
          }
          EOF
          $BT/aapt package -f -m -J src -M AndroidManifest.xml -S res -I "$PF/android.jar"
          javac -source 8 -target 8 -cp "$PF/android.jar" -d obj src/ir/chortkeh/app/*.java
          $BT/d8 --lib "$PF/android.jar" --output . obj/ir/chortkeh/app/*.class
          $BT/aapt package -f -M AndroidManifest.xml -S res -I "$PF/android.jar" -F unaligned.apk
          $BT/aapt add unaligned.apk classes.dex
          $BT/zipalign -f 4 unaligned.apk aligned.apk
          keytool -genkeypair -v -keystore key.jks -alias ch -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Chortkeh,O=Chortkeh,C=IR"
          $BT/apksigner sign --ks key.jks --ks-pass pass:123456 --key-pass pass:123456 --out chortkeh.apk aligned.apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A && git commit -m "Add favicon, header logo, and splash intro" || true
          git push
