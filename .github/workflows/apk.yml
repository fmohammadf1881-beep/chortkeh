name: Build Signed APK
on:
  push:
    paths: ['.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SP: ${{ secrets.SIGNING_PASS }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Secure APK
        run: |
          if [ -z "$SP" ]; then echo "Secret SIGNING_PASS is missing!"; exit 1; fi
          git rm -rf --ignore-unmatch key.jks unaligned.apk aligned.apk classes.dex obj src res AndroidManifest.xml
          BT=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | sort -V | tail -n 1)
          PF=$(ls -d $ANDROID_SDK_ROOT/platforms/android-* | sort -V | tail -n 1)
          mkdir -p src/ir/chortkeh/app res/drawable obj
          cp logo.png res/drawable/icon.png
          if [ -f key.jks.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -pass env:SP -in key.jks.enc -out private.jks
          else
            keytool -genkeypair -v -keystore private.jks -alias chortkeh -keyalg RSA -keysize 2048 -validity 10000 -storepass "$SP" -keypass "$SP" -dname "CN=Chortkeh,O=Chortkeh,C=IR"
            openssl enc -aes-256-cbc -pbkdf2 -iter 100000 -salt -pass env:SP -in private.jks -out key.jks.enc
          fi
          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android" package="ir.chortkeh.app" android:versionCode="5" android:versionName="1.4"><uses-sdk android:minSdkVersion="21" android:targetSdkVersion="34"/><uses-permission android:name="android.permission.INTERNET"/><application android:label="چرتکه" android:icon="@drawable/icon" android:theme="@android:style/Theme.DeviceDefault.NoActionBar"><activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > AndroidManifest.xml
          cat << 'EOF' > src/ir/chortkeh/app/MainActivity.java
          package ir.chortkeh.app;
          import android.app.Activity; import android.content.Intent; import android.graphics.*; import android.graphics.drawable.GradientDrawable;
          import android.net.Uri; import android.os.Bundle; import android.view.*; import android.webkit.*; import android.widget.*;
          public class MainActivity extends Activity {
            WebView w; LinearLayout sp;
            @Override protected void onCreate(Bundle b) {
              super.onCreate(b); FrameLayout root = new FrameLayout(this);
              w = new WebView(this); WebSettings s = w.getSettings(); s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true);
              sp = new LinearLayout(this); sp.setOrientation(LinearLayout.VERTICAL); sp.setGravity(Gravity.CENTER);
              sp.setBackground(new GradientDrawable(GradientDrawable.Orientation.TL_BR, new int[]{0xFF0F172A, 0xFF1E40AF}));
              ImageView im = new ImageView(this); im.setImageResource(R.drawable.icon);
              LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(240, 240); lp.bottomMargin = 36; sp.addView(im, lp);
              TextView t1 = new TextView(this); t1.setText("چرتکه"); t1.setTextColor(Color.WHITE); t1.setTextSize(26); t1.setTypeface(null, Typeface.BOLD); t1.setGravity(Gravity.CENTER); sp.addView(t1);
              TextView t2 = new TextView(this); t2.setText("جعبه ابزار هوشمند محاسباتی"); t2.setTextColor(0xFFCBD5E1); t2.setTextSize(14); t2.setGravity(Gravity.CENTER);
              LinearLayout.LayoutParams lp2 = new LinearLayout.LayoutParams(-2, -2); lp2.topMargin = 10; lp2.bottomMargin = 50; sp.addView(t2, lp2);
              sp.addView(new ProgressBar(this), new LinearLayout.LayoutParams(90, 90));
              w.setWebViewClient(new WebViewClient() {
                @Override public void onPageFinished(WebView v, String u) { sp.animate().alpha(0f).setDuration(400).withEndAction(() -> sp.setVisibility(View.GONE)); }
                @Override public boolean shouldOverrideUrlLoading(WebView v, String u) { if (u.contains("github.io")) return false; startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(u))); return true; }
              });
              root.addView(w); root.addView(sp); setContentView(root);
              w.loadUrl("https://fmohammadf1881-beep.github.io/chortkeh/");
            }
            @Override public void onBackPressed() { if (w != null && w.canGoBack()) w.goBack(); else super.onBackPressed(); }
          }
          EOF
          $BT/aapt package -f -m -J src -M AndroidManifest.xml -S res -I "$PF/android.jar"
          javac -source 8 -target 8 -cp "$PF/android.jar" -d obj src/ir/chortkeh/app/*.java
          $BT/d8 --lib "$PF/android.jar" --output . obj/ir/chortkeh/app/*.class
          $BT/aapt package -f -M AndroidManifest.xml -S res -I "$PF/android.jar" -F unaligned.apk
          $BT/aapt add unaligned.apk classes.dex && $BT/zipalign -f 4 unaligned.apk aligned.apk
          $BT/apksigner sign --ks private.jks --ks-pass env:SP --key-pass env:SP --out chortkeh.apk aligned.apk
          rm -rf private.jks unaligned.apk aligned.apk classes.dex obj src res AndroidManifest.xml
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add chortkeh.apk key.jks.enc
          git commit -m "Secure APK build v1.4 (API 34)" || true
          git push
# END
