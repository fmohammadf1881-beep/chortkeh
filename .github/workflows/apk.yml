name: Build APK
on:
  push:
    paths: ['.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Android APK
        run: |
          BT=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | sort -V | tail -n 1)
          PF=$(ls -d $ANDROID_SDK_ROOT/platforms/android-* | sort -V | tail -n 1)
          mkdir -p src/ir/chortkeh/app res/drawable obj
          convert -size 192x192 xc:"#1e40af" -gravity center -fill white -pointsize 72 -annotate 0 "Ch" res/drawable/icon.png
          cat << 'EOF' > AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="ir.chortkeh.app" android:versionCode="1" android:versionName="1.0">
            <uses-sdk android:minSdkVersion="21" android:targetSdkVersion="33"/>
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="چرتکه" android:icon="@drawable/icon" android:usesCleartextTraffic="true" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat << 'EOF' > src/ir/chortkeh/app/MainActivity.java
          package ir.chortkeh.app;
          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
            private WebView w;
            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              w = new WebView(this);
              WebSettings s = w.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              w.setWebViewClient(new WebViewClient() {
                @Override public boolean shouldOverrideUrlLoading(WebView v, String u) {
                  if (u.contains("github.io")) return false;
                  startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(u)));
                  return true;
                }
              });
              setContentView(w);
              w.loadUrl("https://fmohammadf1881-beep.github.io/chortkeh/");
            }
            @Override public void onBackPressed() {
              if (w != null && w.canGoBack()) w.goBack(); else super.onBackPressed();
            }
          }
          EOF
          $BT/aapt package -f -m -J src -M AndroidManifest.xml -S res -I $PF/android.jar
          javac -source 1.8 -target 1.8 -cp $PF/android.jar -d obj src/ir/chortkeh/app/*.java
          $BT/d8 --lib $PF/android.jar --output . obj/ir/chortkeh/app/*.class
          $BT/aapt package -f -M AndroidManifest.xml -S res -I $PF/android.jar -F unaligned.apk
          $BT/aapt add unaligned.apk classes.dex
          $BT/zipalign -f 4 unaligned.apk aligned.apk
          keytool -genkeypair -v -keystore key.jks -alias ch -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Chortkeh,O=Chortkeh,C=IR"
          $BT/apksigner sign --ks key.jks --ks-pass pass:123456 --key-pass pass:123456 --out chortkeh.apk aligned.apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add chortkeh.apk
          git commit -m "Add Android APK" || true
          git push
