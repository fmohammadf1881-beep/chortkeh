<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>محاسبه دقیق سن آنلاین (شمسی به سال، ماه، روز و ساعت) | چرتکه</title>
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>
<main>
  <div class="box">
    <h1 style="font-size:17px;color:var(--pr);margin-bottom:14px">📅 محاسبه دقیق سن و روزهای زندگی</h1>
    <div class="fg" style="display:flex;gap:8px">
      <div style="flex:1"><label>روز تولد</label><input type="number" id="d" class="inp" value="15" min="1" max="31" style="text-align:center"></div>
      <div style="flex:1"><label>ماه تولد</label><input type="number" id="m" class="inp" value="6" min="1" max="12" style="text-align:center"></div>
      <div style="flex:1.4"><label>سال تولد (از ۱۲۵۵)</label><input type="number" id="y" class="inp" value="1375" min="1255" max="1405" style="text-align:center"></div>
    </div>
    <button class="btn" onclick="calc()">محاسبه دقیق سن</button>
    <div id="res" class="res">
      <div class="r-row"><span>سن دقیق شما:</span><b id="r1">-</b></div>
      <div class="r-row"><span>کل روزهای سپری‌شده:</span><b id="r2">-</b></div>
      <div class="r-row"><span>کل ساعات عمر:</span><b id="r3">-</b></div>
      <div class="r-row"><span>مانده تا تولد بعدی:</span><b id="r4">-</b></div>
      <div class="r-row"><span>فصل تولد:</span><b id="r5">-</b></div>
    </div>
  </div>
  <div class="box seo">
    <h2>محاسبه سن دقیق خورشیدی</h2>
    <p>با وارد کردن تاریخ تولد شمسی خود (از سال ۱۲۵۵ تا امروز)، سن دقیق خود را به سال، ماه، روز و ساعت به همراه تعداد روزهای باقی‌مانده تا جشن تولد بعدی مشاهده کنید.</p>
  </div>
</main>
<script src="app.js?v=4"></script>
<script>
function jDays(y,m,d){
  return y*365+Math.floor(y/4)+(m<=7?(m-1)*31:(m-7)*30+186)+d;
}
function calc(){
  const p=new Intl.DateTimeFormat('fa-IR-u-nu-latn',{year:'numeric',month:'numeric',day:'numeric'}).format(new Date()).split('/');
  let cy=+p[0],cm=+p[1],cd=+p[2];
  let by=parseInt(document.getElementById('y').value),bm=parseInt(document.getElementById('m').value),bd=parseInt(document.getElementById('d').value);
  if(!by||by<1255||by>cy||bm<1||bm>12||bd<1||bd>31){
    alert('لطفاً سال تولد را بین ۱۲۵۵ تا '+toFa(cy)+' و ماه و روز را به درستی وارد کنید.');return;
  }
  let y=cy-by,m=cm-bm,d=cd-bd;
  if(d<0){d+=(bm<=6?31:30);m--;}
  if(m<0){m+=12;y--;}
  let tot=Math.max(0,jDays(cy,cm,cd)-jDays(by,bm,bd));
  let ny=cm>bm||(cm===bm&&cd>bd)?cy+1:cy;
  let rem=jDays(ny,bm,bd)-jDays(cy,cm,cd);
  const s=['بهار 🌸','تابستان ☀️','پاییز 🍂','زمستان ❄️'][Math.floor((bm-1)/3)];
  document.getElementById('r1').innerText=`${fmt(y)} سال و ${fmt(m)} ماه و ${fmt(d)} روز`;
  document.getElementById('r2').innerText=fmt(tot)+' روز';
  document.getElementById('r3').innerText=fmt(tot*24)+' ساعت';
  document.getElementById('r4').innerText=rem===0?'🎉 امروز تولد شماست!':fmt(rem)+' روز دیگر';
  document.getElementById('r5').innerText=s;
  document.getElementById('res').classList.add('on');
}
</script>
</body>
</html>
