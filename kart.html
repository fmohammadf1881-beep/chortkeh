<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تشخیص نام بانک از شماره کارت و بررسی صحت شبا | چرتکه</title>
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>
<main>
  <div class="box">
    <h1 style="font-size:17px;color:var(--pr);margin-bottom:14px">💳 تشخیص بانک و اعتبارسنجی کارت و شبا</h1>
    <div class="fg">
      <label>شماره کارت ۱۶ رقمی (یا ۶ رقم اول برای تشخیص بانک)</label>
      <input type="text" id="c" class="inp" placeholder="603799..." maxlength="16" oninput="chkNum(this,16,'c-err')" inputmode="numeric">
      <div id="c-err" style="color:#ef4444;font-size:11px;font-weight:700;margin-top:4px;display:none"></div>
    </div>
    <div class="fg">
      <label>شماره شبا (۲۴ رقم بعد از IR را وارد کنید)</label>
      <div style="display:flex;direction:ltr;align-items:stretch">
        <span style="background:var(--pr);color:#fff;font-weight:900;padding:10px 14px;border-radius:10px 0 0 10px;display:flex;align-items:center;font-size:15px;letter-spacing:1px">IR</span>
        <input type="text" id="sh" class="inp" placeholder="000000000000000000000000" maxlength="24" oninput="chkNum(this,24,'sh-err')" inputmode="numeric" style="border-radius:0 10px 10px 0;border-left:none">
      </div>
      <div id="sh-err" style="color:#ef4444;font-size:11px;font-weight:700;margin-top:4px;display:none"></div>
    </div>
    <button class="btn" onclick="calc()">بررسی اعتبار کارت و شبا</button>
    <div id="res" class="res">
      <div class="r-row"><span>نام بانک صادرکننده:</span><b id="r1">-</b></div>
      <div class="r-row"><span>اعتبار شماره کارت:</span><b id="r2">-</b></div>
      <div class="r-row"><span>اعتبار شماره شبا:</span><b id="r3">-</b></div>
    </div>
  </div>
  <div class="box seo">
    <h2>الگوریتم تشخیص شماره کارت و شبا</h2>
    <p>شماره کارت بانکی با الگوریتم استاندارد لوهن (Luhn) و شماره شبا (۲۴ رقم پس از IR ثابت) با استاندارد جهانی ISO-7064 بررسی و نام بانک استخراج می‌شود.</p>
  </div>
</main>
<script src="app.js?v=4"></script>
<script>
const BC={'603799':'بانک ملی','589210':'بانک سپه','627648':'توسعه صادرات','627961':'صنعت و معدن','603770':'کشاورزی','628023':'مسکن','627760':'پست بانک','502908':'توسعه تعاون','627412':'اقتصاد نوین','622106':'پارسیان','502229':'پاسارگاد','627488':'کارآفرین','621986':'سامان','639346':'سینا','639607':'سرمایه','636214':'آینده','502806':'شهر','502938':'دی','603769':'صادرات','610433':'ملت','627353':'تجارت','589463':'رفاه','639370':'مهر اقتصاد','504172':'رسالت','606373':'مهر ایران','505416':'گردشگری','636949':'حکمت','585983':'تجارت'};
const BS={'017':'بانک ملی','015':'بانک سپه','020':'توسعه صادرات','011':'صنعت و معدن','016':'کشاورزی','014':'مسکن','021':'پست بانک','022':'توسعه تعاون','055':'اقتصاد نوین','054':'پارسیان','057':'پاسارگاد','053':'کارآفرین','056':'سامان','059':'سینا','058':'سرمایه','062':'آینده','061':'شهر','066':'دی','019':'صادرات','012':'ملت','018':'تجارت','013':'رفاه','070':'رسالت','060':'مهر ایران','064':'گردشگری'};
function chkNum(el,mx,errId){
  let raw=el.value.replace(/^IR/i,''),cln=raw.replace(/\D/g,'').slice(0,mx);
  let bx=document.getElementById(errId);
  if(raw!==cln){bx.innerText='⚠️ فقط وارد کردن اعداد مجاز است!';bx.style.display='block';}
  else bx.style.display='none';
  el.value=cln;
}
function luhn(s){
  if(s.length!==16)return false;
  let sum=0;for(let i=0;i<16;i++){let d=+s[i]*(i%2===0?2:1);sum+=d>9?d-9:d;}
  return sum%10===0;
}
function calc(){
  let c=document.getElementById('c').value.replace(/\D/g,'');
  let sh=document.getElementById('sh').value.replace(/\D/g,'');
  let bName=c.length>=6?(BC[c.slice(0,6)]||'بانک نامشخص'):(sh.length>=5?(BS[sh.slice(2,5)]||'بانک نامشخص'):'وارد نشده');
  let cOk=!c?'وارد نشده':c.length<16?`ناقص (${fmt(c.length)} از ۱۶ رقم)`:(luhn(c)?'✅ معتبر و صحیح':'❌ نامعتبر (خطای رقم)');
  let shOk='وارد نشده';
  if(sh){
    if(sh.length!==24)shOk=`❌ ناقص (${fmt(sh.length)} از ۲۴ رقم)`;
    else{
      let mv=sh.slice(2)+'1827'+sh.slice(0,2);
      shOk=BigInt(mv)%97n===1n?'✅ شبای معتبر و صحیح':'❌ شبای نامعتبر';
    }
  }
  document.getElementById('r1').innerText=bName;
  document.getElementById('r2').innerText=cOk;
  document.getElementById('r3').innerText=shOk;
  document.getElementById('res').classList.add('on');
}
</script>
</body>
</html>
